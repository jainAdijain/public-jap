name: CI

on:
  push:
  pull_request:

jobs:
  app:
    name: app (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jap
          POSTGRES_PASSWORD: jap
          POSTGRES_DB: jap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jap" --health-interval 2s --health-timeout 3s
          --health-retries 30
    env:
      # Tests create and migrate their own jap_test database next to this one.
      DATABASE_URL: postgresql+psycopg://jap:jap@localhost:5432/jap
      JAP_REQUIRE_DB: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install ".[dev]"
      # The apply tests read and submit local forms in a real headless Chromium.
      - run: python -m playwright install --with-deps chromium
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .
      - run: pytest -q

  ui:
    name: ui (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  agents:
    name: agent guards (hook self-test, nothing private tracked, docs agree with the code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 infra/scripts/agent-guard.py --self-test
      - run: infra/scripts/check-tracked.sh
      - run: python3 infra/scripts/check_docs.py

  compose:
    name: compose file is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose --env-file .env -f infra/compose.yaml config --quiet
      - name: release overlay (live) is valid
        # env-create.sh leaves the secrets empty, as it does on the server; the three below
        # are the ones compose refuses to render without, so the check supplies them.
        run: |
          infra/scripts/env-create.sh
          docker compose --env-file .env.live -f infra/compose.yaml -f infra/compose.release.yaml config --quiet
        env:
          JAP_IMAGE_TAG: v0.0.0
          TUNNEL_TOKEN: placeholder
