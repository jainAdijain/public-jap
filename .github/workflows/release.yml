# Builds the two images live runs and pushes them to GHCR (README, Hosting).
#
# A version tag is the release: `git tag v0.21.0 && git push --tags` builds, and on the
# server `make deploy TAG=v0.21.0` checks out that tag and pulls these images. The tag is in
# the image name and in the checkout, so the compose files and the code they start are
# always the same version, and a rollback is the same command with the previous tag.
#
# linux/amd64 and linux/arm64 (decision 31): the first server is an ARM VM, a later one may
# well be amd64, and one tag serves either. Each platform builds on a runner of its own
# architecture rather than under emulation, which would take the Chromium image from minutes
# to most of an hour, and the last job joins the two into one multi-arch tag. A Mac still
# cannot start live by accident: the Makefile refuses the release stack on Darwin.
name: Release

on:
  push:
    tags: ["v*"]
  # For checking the build without cutting a release; nothing is pushed.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: ${{ matrix.image }} image, ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [app, ui]
        platform: [linux/amd64, linux/arm64]
        include:
          - image: app
            dockerfile: infra/docker/app.Dockerfile
            target: ""
          - image: ui
            dockerfile: infra/docker/ui.Dockerfile
            target: release
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Sign in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: name
        # GHCR names are lower case; the repository owner is not.
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}

      # Pushed by digest only: the tags go on in the merge job, once both platforms exist, so
      # a tag never points at an image that one architecture cannot run.
      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: >-
            type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=${{ startsWith(github.ref, 'refs/tags/v') }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Keep the digest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  tags:
    name: ${{ matrix.image }} tags
    needs: images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [app, ui]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: name
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Names and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          # The tag as it is (v0.21.0), so it matches what `make deploy TAG=` takes, plus
          # the commit, so an image can always be traced back to what built it.
          tags: |
            type=ref,event=tag
            type=sha,format=long

      - name: One tag for both platforms
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Check both platforms are there
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          TAG: ${{ github.ref_name }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$TAG"
          for arch in amd64 arm64; do
            docker buildx imagetools inspect --raw "$IMAGE:$TAG" | jq -e --arg a "$arch" \
              '.manifests | map(.platform.architecture) | index($a)' > /dev/null
          done
