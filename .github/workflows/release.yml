# Builds the two images live runs and pushes them to GHCR (README, Hosting).
#
# A version tag is the release: `git tag v0.21.0 && git push --tags` builds, and on the
# server `make deploy TAG=v0.21.0` checks out that tag and pulls these images. The tag is in
# the image name and in the checkout, so the compose files and the code they start are
# always the same version, and a rollback is the same command with the previous tag.
#
# linux/amd64 only. The server is amd64 and the Mac is not, which is the point: the live
# stack cannot be started by accident on a laptop (AGENTS.md, Running and verifying).
name: Release

on:
  push:
    tags: ["v*"]
  # For checking the build without cutting a release; nothing is pushed.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: ${{ matrix.image }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: app
            dockerfile: infra/docker/app.Dockerfile
            target: ""
          - image: ui
            dockerfile: infra/docker/ui.Dockerfile
            target: release
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Names and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.image }}
          # The tag as it is (v0.21.0), so it matches what `make deploy TAG=` takes, plus
          # the commit, so an image can always be traced back to what built it.
          tags: |
            type=ref,event=tag
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
